[package]
name = "pipe-docs-server"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
pulldown-cmark = "0.11"
moka = { version = "0.12", features = ["future"] }
once_cell = "1.21"

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
tempfile = "3.14"
