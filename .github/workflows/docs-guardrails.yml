name: Docs Guardrails

on:
  pull_request:
    paths:
      - "README.md"
      - "docs/**"
      - "internal/**"
      - "src/**"
      - "tests/**"
      - "Cargo.toml"
      - ".github/workflows/docs-guardrails.yml"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "docs/**"
      - "internal/**"
      - "src/**"
      - "tests/**"
      - "Cargo.toml"
      - ".github/workflows/docs-guardrails.yml"

jobs:
  legacy-tokenomics-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install wallet-helper test dependency
        run: python3 -m pip install cryptography
      - name: Check current mainnet content
        run: python3 docs/scripts/check_mainnet_docs.py
      - name: Check policy and parameter consistency
        run: python3 docs/scripts/check_tokenomics_params_sync.py
      - name: Check published links and anchors
        run: python3 docs/scripts/check_markdown_links.py
      - name: Check wallet preparation and documentation guardrails
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check Rust formatting
        run: cargo fmt --check
      - name: Check document serving
        run: cargo test
